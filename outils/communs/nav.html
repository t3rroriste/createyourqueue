<!-- La barre de navigation, pour TOUTES les pages qui en portent une.
     Source unique : outils/fragments.py la recopie dans chaque page entre
     ses deux repères. Ne pas modifier le résultat dans une page — il sera
     réécrit au prochain passage, et la correction sera perdue.

     Quatre paramètres :
       courant   index · modules · guide · support · aucun
       origine   site · externe (un AUTRE domaine : le panneau, status)
       bouton    connexion · retour · aucun
       plain     oui (la variante sans fond, sur status)

     `origine=externe` ajoute les data-site : depuis le panneau ou depuis
     status.cyqbot.eu, un lien vers la vitrine change de domaine, et c'est
     app.js qui le rend absolu. Un seul mot pour les deux cas, parce que
     la nav s'en moque : ce qui compte est « ailleurs », pas « où ». -->
<nav class="nav{{si plain=oui}} nav--plain{{/si}}" aria-label="Principale" data-nav>
  <a class="nav__mark" href="index" data-site="index">
    <img src="assets/img/logo.png" alt="" width="22" height="22">
    <span>CreateYourQueue</span>
  </a>
  <div class="nav__links">
    <!-- href="guide" et non "#" : DOCS_URL vaut « guide » aujourd'hui,
         mais un lien de la vitrine ne doit pas dépendre d'un réglage pour
         mener quelque part. app.js récrit par-dessus quand DOCS_URL est
         posé, et ne touche à rien quand il est vide. -->
    <a href="guide"{{si origine=externe}} data-site="guide"{{/si}} data-cfg-link="DOCS_URL"{{si courant=guide}} aria-current="page"{{/si}} data-i18n="n.docs">Documentation</a>
    <a href="modules"{{si origine=externe}} data-site="modules"{{/si}}{{si courant=modules}} aria-current="page"{{/si}} data-i18n="m.nav">Modules</a>
    <!-- Pas de data-cfg-link ici, contrairement aux autres entrées :
         SUPPORT_URL désigne le serveur Discord, et app.js récrivait ce
         lien avec. L'onglet Support ne menait donc jamais à la page
         Support — il sautait sur Discord. Le serveur garde sa carte dans
         la page, où il a sa place. -->
    <a href="support"{{si origine=externe}} data-site="support"{{/si}}{{si courant=support}} aria-current="page"{{/si}} data-i18n="n.support">Support</a>
  </div>
  <div class="langmenu">
    <!-- UN ÉCROU, PAS UN DRAPEAU.

         Le bouton montrait le drapeau du pays et son code — « FR ». Deux
         défauts : il annonçait la langue courante, que personne ne
         cherche puisqu'on est en train de la lire, et il ne disait rien
         du thème, qui est l'autre moitié du menu. Un écrou ne nomme
         aucun des deux et les contient tous les deux : c'est le signe
         des réglages, et il est lu comme tel partout.

         Il tourne d'un quart de tour au clic — voir `faireTournerLEcrou`
         dans app.js. Les drapeaux restent dans la liste, où ils servent :
         c'est là qu'on choisit.

         `c.prefs` et non `c.lang` : le menu porte deux réglages. -->
    <button class="disc langmenu__btn" type="button" data-lang-menu
            aria-haspopup="menu" aria-expanded="false" data-i18n-attr="aria-label:c.prefs">
      <svg class="langmenu__ecrou" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-ecrou><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <div class="langmenu__panel" role="menu" data-i18n-attr="aria-label:c.lang">
      <!-- LE THÈME, AU-DESSUS DES LANGUES.

           Les deux réglages sont de même nature — comment la page
           s'affiche pour moi, et non ce qu'elle dit — et ils vivaient
           dans deux commandes séparées dont l'une n'était posée nulle
           part. Un seul menu, deux groupes, un filet entre les deux.

           Trois choix et non un bascule : « Système » n'est pas un
           troisième thème, c'est l'absence de choix, et c'est le
           défaut. Sans lui, on ne peut plus revenir en arrière une fois
           qu'on a touché au réglage. -->
      <p class="langmenu__titre" data-i18n="c.theme">Thème</p>
      <div class="langmenu__themes" role="group" data-i18n-attr="aria-label:c.theme">
        <button class="langmenu__theme" type="button" role="menuitemradio"
                data-theme-pick="system" aria-checked="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span data-i18n="c.themeSystem">Système</span>
        </button>
        <button class="langmenu__theme" type="button" role="menuitemradio"
                data-theme-pick="light" aria-checked="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span data-i18n="c.themeLightName">Clair</span>
        </button>
        <button class="langmenu__theme" type="button" role="menuitemradio"
                data-theme-pick="dark" aria-checked="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span data-i18n="c.themeDarkName">Sombre</span>
        </button>
      </div>
      <p class="langmenu__titre" data-i18n="c.lang">Langue</p>
      <button class="langmenu__opt" type="button" role="menuitemradio" data-lang-pick="fr" aria-checked="true">Français<span class="code">fr</span></button>
      <button class="langmenu__opt" type="button" role="menuitemradio" data-lang-pick="en" aria-checked="false">English<span class="code">en</span></button>
      <button class="langmenu__opt" type="button" role="menuitemradio" data-lang-pick="es" aria-checked="false">Español<span class="code">es</span></button>
      <button class="langmenu__opt" type="button" role="menuitemradio" data-lang-pick="de" aria-checked="false">Deutsch<span class="code">de</span></button>
      <button class="langmenu__opt" type="button" role="menuitemradio" data-lang-pick="ko" aria-checked="false" lang="ko">한국어<span class="code">ko</span></button>
    </div>
  </div>
{{si bouton=connexion}}
  <!-- data-login : app.js y pose l'URL de connexion. Sans cet attribut,
       le bouton se contentait d'emmener sur la page de choix de serveur. -->
  <a class="pill" href="servers" data-login>
    <span data-i18n="n.login">Se connecter</span>
    <span class="pill__arrow"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
  </a>
{{/si}}
{{si bouton=retour}}
  <a class="pill pill--ghost pill--sm" href="index" data-site="index" data-i18n="c.back">Retour</a>
{{/si}}
</nav>
